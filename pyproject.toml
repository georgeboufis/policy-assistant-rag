[project]
name = "policy-assistant-rag"
version = "1.0.0"
description = "A retrieval-augmented assistant that answers only from your documents, with citations."
requires-python = ">=3.12,<3.13"

dependencies = [
    # The chat model, over Groq's OpenAI-compatible API
    "openai>=3.0.0,<4.0.0",
    # Embeddings, computed locally through ONNX - no torch, no GPU, no API calls
    "fastembed>=0.9.0",
    "chromadb>=1.5.9",
    "numpy",
    # Readers, one per file type
    "pypdf>=6.0.0,<7.0.0",
    "python-docx>=1.2.0",
    "beautifulsoup4>=4.15.0",
    # The API behind the React interface
    "fastapi>=0.120.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.11.7,<3.0.0",
    "python-dotenv>=1.1.1,<2.0.0",
]

[tool.uv]
package = false
